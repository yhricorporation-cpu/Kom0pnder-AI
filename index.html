<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06183f">
<title>KomOpnder Sanitary – Rates</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Sora:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef5ff;--card:#fff;--ink:#06183f;--mute:#5d6e94;--aqua:#0aa7e6;--navy:#06183f;--line:#dbe6f8;--tile:#e2f1ff;--seg:#dce9fb;color-scheme:light;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#040f27;--card:#0d2250;--ink:#eaf2ff;--mute:#9db2de;--aqua:#37c2ff;--navy:#0a1d46;--line:#1f3d78;--tile:#16356b;--seg:#0d2250;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#040f27;--card:#0d2250;--ink:#eaf2ff;--mute:#9db2de;--aqua:#37c2ff;--navy:#0a1d46;--line:#1f3d78;--tile:#16356b;--seg:#0d2250;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.35 "Hind Siliguri",Roboto,system-ui,sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto;overflow:hidden}
:focus-visible{outline:3px solid var(--aqua);outline-offset:2px}
header{background:#06183f;color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 22px;border-radius:0 0 30px 30px;display:flex;align-items:center;gap:12px;flex:none;position:relative}
header img{width:46px;height:46px;border-radius:14px;background:#fff;object-fit:cover}
.t{flex:1;line-height:1.1}
.t h1{font:800 20px Sora,"Hind Siliguri",sans-serif;margin:0}
.t small{color:#9fd8ff;font-size:13px}
.hb{width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;font:700 14px "Hind Siliguri",sans-serif;display:grid;place-items:center;text-decoration:none}
.hb.c{background:#19c3ff;border-color:#19c3ff;color:#06183f;font-size:20px}
.seg{display:flex;background:var(--seg);border-radius:18px;padding:4px;margin:-18px 16px 10px;position:relative;box-shadow:0 6px 18px rgba(6,24,63,.18);flex:none}
.seg button{flex:1;height:44px;border:0;border-radius:14px;background:transparent;color:var(--mute);font:600 15px "Hind Siliguri",sans-serif}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(6,24,63,.15)}
#list{flex:1;overflow-y:auto;padding:2px 16px 14px;display:grid;gap:9px;align-content:start}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:9px 10px 9px 10px;min-height:64px;border:1.5px solid transparent}
.row.on{border-color:var(--aqua)}
.ic{width:46px;height:46px;border-radius:15px;background:var(--tile);display:grid;place-items:center;font-size:22px;flex:none}
.n{flex:1;min-width:0}
.n b{display:block;font-weight:600;font-size:16px;line-height:1.2}
.n span{color:var(--mute);font-size:13px}
.p{font:800 16px Sora,sans-serif;white-space:nowrap}
.q{display:flex;align-items:center;background:var(--tile);border-radius:99px}
.q button{width:44px;height:44px;border-radius:50%;border:0;background:var(--navy);color:#fff;font:600 24px/1 sans-serif}
:root:not([data-theme="light"]) .q button{--x:0}
.q button.m{background:transparent;color:var(--ink)}
.q i{min-width:20px;text-align:center;font:800 15px Sora,sans-serif;font-style:normal}
.bar{position:relative;flex:none;margin:0 12px 12px;border-radius:26px;background:var(--navy);color:#fff;overflow:hidden;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;isolation:isolate}
.fill{position:absolute;left:0;right:0;bottom:0;height:calc(var(--l,0)*1%);background:rgba(25,195,255,.33);transition:height .9s cubic-bezier(.3,1.3,.5,1);z-index:-1}
.fill svg{position:absolute;top:-10px;left:0;width:200%;height:11px;fill:rgba(25,195,255,.33);animation:w 3.5s linear infinite}
@keyframes w{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.fill svg{animation:none}.fill{transition:none}}
.bar div{flex:1;line-height:1.1}
.bar small{color:#9fd8ff;font-size:13px;display:block}
.bar b{font:800 24px Sora,sans-serif}
.go{height:52px;padding:0 20px;border-radius:18px;background:#1ea952;color:#fff;font:700 16px "Hind Siliguri",sans-serif;text-decoration:none;display:grid;place-items:center;text-align:center;line-height:1.1}
.go[aria-disabled=true]{background:rgba(255,255,255,.14);color:#a9bbe0;pointer-events:none}
</style>
</head>
